name: Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 06:00 NZST daily (UTC+12 → 18:00 UTC previous day)
    - cron: '0 18 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, skills-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install CloakBrowser for browser-assisted smoke tests
        run: |
          uv run --no-project --with cloakbrowser python -m cloakbrowser install
          uv run --no-project --with cloakbrowser python - <<'PY'
          from cloakbrowser import launch
          print("CloakBrowser import OK", launch)
          PY

      - name: Run smoke tests (parallel)
        id: smoke
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          METOCEAN_API_KEY: ${{ secrets.METOCEAN_API_KEY }}
          METLINK_API_KEY: ${{ secrets.METLINK_API_KEY }}
          COLAB_SMOKE_WITH_CLOAKBROWSER: "1"
          COLAB_SMOKE_USE_BROWSER: "1"
          SMOKE_SUMMARY: ${{ runner.temp }}/smoke-summary-${{ github.run_id }}.json
        run: |
          smoke_status=0
          bash scripts/run_all_smoke.sh --summary-json > "$SMOKE_SUMMARY" || smoke_status=$?
          python3 - "$SMOKE_SUMMARY" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              summary = json.loads(Path(sys.argv[1]).read_text())
              print(json.dumps({"counts": summary["counts"],
                                "failures": [r["skill"] for r in summary["failures"]]}))
          except (OSError, ValueError, KeyError) as exc:
              print(f"Smoke summary unavailable: {exc}")
          PY
          exit "$smoke_status"

      - name: Upload this run's redacted smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-summary-${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 7

  reconcile:
    needs: smoke
    if: always() && github.event_name == 'schedule' && needs.smoke.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: nightly-smoke-issues
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download this run's smoke summary
        id: summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: smoke-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-summary

      - name: Reconcile nightly smoke failure issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/smoke_failure_issues.py \
            "${{ runner.temp }}/smoke-summary/smoke-summary-${{ github.run_id }}.json" \
            --repo "${{ github.repository }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
