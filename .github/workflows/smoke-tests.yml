name: Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 06:00 NZST daily (UTC+12 → 18:00 UTC previous day)
    - cron: '0 18 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-skill-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, skills-smoke]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install CloakBrowser for browser-assisted smoke tests
        run: |
          uv run --no-project --with cloakbrowser python -m cloakbrowser install
          uv run --no-project --with cloakbrowser python - <<'PY'
          from cloakbrowser import launch
          print("CloakBrowser import OK", launch)
          PY

      - name: Run smoke tests (parallel)
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          METOCEAN_API_KEY: ${{ secrets.METOCEAN_API_KEY }}
          METLINK_API_KEY: ${{ secrets.METLINK_API_KEY }}
          COLAB_SMOKE_WITH_CLOAKBROWSER: "1"
          COLAB_SMOKE_USE_BROWSER: "1"
        run: |
          smoke_status=0
          bash scripts/run_all_smoke.sh --summary-json > smoke-summary.json || smoke_status=$?
          cat smoke-summary.json
          exit "$smoke_status"

      - name: Reconcile nightly smoke failure issues
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s smoke-summary.json ]; then
            python3 scripts/smoke_failure_issues.py smoke-summary.json \
              --repo "${{ github.repository }}" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
